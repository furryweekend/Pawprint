<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Pawprint Admin</title>
	<link rel="stylesheet" href="/admin.css" />
</head>
<body>

	<!-- Login -->
	<div id="login-section" class="login-overlay">
		<div class="login-card">
			<h1>Pawprint Admin</h1>
			<div id="login-error" class="login-error"></div>
			<input type="password" id="password" placeholder="Enter admin password" autofocus />
			<button id="login-btn">Log In</button>
		</div>
	</div>

	<!-- Admin panel -->
	<div id="admin-panel">
		<div class="editor">
			<div class="editor-inner">
				<div class="nav">
					<a href="/">View Page</a>
					<a href="/analytics">Analytics</a>
				</div>
				<h1>Pawprint Admin</h1>
				<p class="subtitle">Edit your profile configuration. Changes are saved instantly.</p>

				<form id="admin-form" onsubmit="return false;">
					<div class="section">
						<h2>Profile</h2>
						<label for="cfg-name">Name</label>
						<input type="text" id="cfg-name" />
						<label for="cfg-bio">Bio</label>
						<input type="text" id="cfg-bio" />
						<label for="cfg-avatar">Avatar URL</label>
						<input type="url" id="cfg-avatar" />
						<label for="cfg-header">Header Image URL (optional)</label>
						<input type="url" id="cfg-header" />
					</div>

					<div class="section">
						<h2>Links</h2>
						<div id="links-container"></div>
						<button type="button" class="add-btn" id="add-link-btn">+ Add Link</button>
					</div>

					<div class="section">
						<h2>Social Media</h2>
						<div id="socials-container"></div>
						<button type="button" class="add-btn" id="add-social-btn">+ Add Social</button>
					</div>

					<div class="section">
						<h2>Theme</h2>
						<p class="hint">Background priority: Image > Color > Gradient. Only the highest-priority option set will be used.</p>
						<div class="row">
							<div>
								<label for="cfg-gradient">Background Gradient</label>
								<select id="cfg-gradient">
									<option value="">None</option>
									<option value="sunset">sunset</option>
									<option value="ocean">ocean</option>
									<option value="forest">forest</option>
									<option value="midnight">midnight</option>
									<option value="aurora">aurora</option>
									<option value="ember">ember</option>
									<option value="lavender">lavender</option>
									<option value="cosmic">cosmic</option>
									<option value="slate">slate</option>
									<option value="candy">candy</option>
								</select>
							</div>
							<div>
								<div class="checkbox-row">
									<input type="checkbox" id="cfg-color-enabled" />
									<label for="cfg-color-enabled">Background Color</label>
								</div>
								<input type="color" id="cfg-color" value="#1a1a2e" />
							</div>
						</div>
						<label for="cfg-bgimage">Background Image URL (optional)</label>
						<input type="url" id="cfg-bgimage" />
						<div class="row">
							<div>
								<label for="cfg-textcolor">Text Color</label>
								<input type="color" id="cfg-textcolor" value="#ffffff" />
							</div>
							<div>
								<label for="cfg-font">Font (Google Fonts)</label>
								<input type="text" id="cfg-font" placeholder="Inter" />
							</div>
						</div>
						<div class="row">
							<div>
								<label for="cfg-buttonstyle">Button Style</label>
								<select id="cfg-buttonstyle">
									<option value="filled">filled</option>
									<option value="outlined">outlined</option>
									<option value="soft">soft</option>
								</select>
							</div>
							<div>
								<label for="cfg-buttonradius">Button Radius</label>
								<input type="text" id="cfg-buttonradius" value="12px" />
							</div>
						</div>
						<div class="row">
							<div>
								<label for="cfg-buttoncolor">Button Color</label>
								<input type="color" id="cfg-buttoncolor" value="#6c63ff" />
							</div>
							<div>
								<label for="cfg-buttontextcolor">Button Text Color</label>
								<input type="color" id="cfg-buttontextcolor" value="#ffffff" />
							</div>
						</div>
					</div>

					<div class="section">
						<h2>Container</h2>
						<div class="row">
							<div>
								<label for="cfg-container">Container Style</label>
								<select id="cfg-container">
									<option value="none">none</option>
									<option value="filled">filled</option>
									<option value="outlined">outlined</option>
									<option value="glass">glass</option>
								</select>
							</div>
							<div>
								<label for="cfg-containerradius">Container Radius</label>
								<input type="text" id="cfg-containerradius" value="12px" />
							</div>
						</div>
						<label for="cfg-containercolor">Container Color</label>
						<input type="color" id="cfg-containercolor" value="#ffffff" />
					</div>

					<div class="actions">
						<button type="button" class="save-btn" id="save-btn">Save Changes</button>
						<button type="button" class="reset-btn" id="reset-btn">Reset</button>
					</div>
				</form>
			</div>
		</div>

		<div class="preview-panel">
			<div class="preview-header">
				<h3>Preview</h3>
			</div>
			<iframe id="preview-frame" class="preview-frame"></iframe>
		</div>
	</div>

	<div id="toast" class="toast"></div>

	<script src="/admin.js"></script>
</body>
</html>
