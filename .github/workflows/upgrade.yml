name: Upgrade Pawprint

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull upstream changes
        run: |
          git remote add upstream https://github.com/furryweekend/Pawprint.git
          git fetch upstream

      - name: Create upgrade branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="upgrade/pawprint-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git merge upstream/main --no-edit
          git push origin "$BRANCH"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Create pull request
        run: |
          gh pr create \
            --title "Upgrade Pawprint to latest" \
            --body "This PR pulls the latest changes from [furryweekend/Pawprint](https://github.com/furryweekend/Pawprint). Review the changes before merging to make sure nothing conflicts with your customizations." \
            --base main \
            --head "$BRANCH"
        env:
          GH_TOKEN: ${{ github.token }}
