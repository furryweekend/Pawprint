# Deploy a temporary preview Worker for every PR so reviewers can test changes
# at a live URL before merging. The preview is deleted when the PR closes.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN  – API token with "Workers Scripts: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID – Cloudflare account ID
#
# Security note: This workflow uses pull_request_target so it can access secrets
# for fork PRs. The workflow YAML always comes from the base branch (main), but
# the checked-out *code* is from the PR head. A malicious PR could tamper with
# build scripts (e.g. npm postinstall) that run before the deploy step. To add
# an extra gate, configure a GitHub Actions environment with required reviewers
# and reference it via `environment: preview` on the deploy job.

name: Preview Deploy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Override worker name for preview
        run: |
          sed -i -E 's/"name":\s*"[^"]*"/"name": "pawprint-pr-${{ github.event.pull_request.number }}"/' wrangler.jsonc

      - name: Deploy preview worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          OUTPUT=$(npx wrangler deploy 2>&1 | tee /dev/stderr)
          URL=$(echo "$OUTPUT" | grep -oP 'https://\S+\.workers\.dev' | head -1)
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Set preview admin password
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "preview" | npx wrangler secret put ADMIN_PASSWORD --name "pawprint-pr-${{ github.event.pull_request.number }}"

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.preview_url }}';
            const sha = '${{ github.event.pull_request.head.sha }}'.slice(0, 7);
            const body = [
              '### 🔗 Preview Deploy',
              '',
              `**Preview:** ${url}`,
              `**Admin panel:** ${url}/admin (password: \`preview\`)`,
              '',
              `_Deployed from ${sha}_`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            const existing = comments.find(c => c.body?.includes('### 🔗 Preview Deploy'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }

  cleanup-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete preview worker
        run: |
          curl -sS -X DELETE \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/workers/scripts/pawprint-pr-${{ github.event.pull_request.number }}" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json"
